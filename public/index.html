<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="学习中心" />
  <script>
    // Paint in the reader's chosen theme before anything else in <head>, and
    // create the phone chrome hints here (not as static tags) so iOS cannot
    // latch onto the opposite theme's status-bar value while parsing.
    (function () {
      var t = null;
      try { t = localStorage.getItem('lc:theme'); } catch (e) {}

      // The iOS swap navigates with ?lc-theme=..., which also covers the case
      // where storage is unavailable. The swap marker below stays authoritative.
      var fromQuery = null;
      try {
        var q = new URLSearchParams(location.search).get('lc-theme');
        if (q === 'light' || q === 'dark') fromQuery = q;
      } catch (e) {}
      if (fromQuery) t = fromQuery;

      // The one-shot swap marker carries the destination even if localStorage
      // is unavailable; it is consumed here, before the app boots.
      var swap = null;
      try {
        var raw = sessionStorage.getItem('lc:theme-swap');
        if (raw) {
          sessionStorage.removeItem('lc:theme-swap');
          swap = JSON.parse(raw);
          if (!swap || Date.now() - swap.at > 5000) swap = null;
        }
      } catch (e) {}
      if (swap && (swap.theme === 'light' || swap.theme === 'dark')) {
        t = swap.theme;
        try { localStorage.setItem('lc:theme', t); } catch (e) {}
      }

      if (t !== 'light' && t !== 'dark') {
        try {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch (e) {
          t = 'light';
        }
      }

      document.documentElement.dataset.theme = t;
      document.documentElement.style.colorScheme = t;

      function setMeta(name, content) {
        var m = document.querySelector('meta[name="' + name + '"]');
        if (!m) {
          m = document.createElement('meta');
          m.setAttribute('name', name);
          document.head.appendChild(m);
        }
        m.setAttribute('content', content);
      }
      setMeta('theme-color', t === 'light' ? '#f7f4ec' : '#14130f');
      setMeta('color-scheme', 'light dark');
      setMeta('apple-mobile-web-app-status-bar-style', t === 'light' ? 'default' : 'black-translucent');

      // An iOS home-screen app only re-reads the status-bar style on load, so
      // app.js navigates after a theme choice. If that is happening, cover this
      // document's first paint with the destination colour; it is faded out
      // once the page (or reader) is restored.
      if (swap) {
        try {
          history.scrollRestoration = 'manual';
          var bg = t === 'light' ? '#f7f4ec' : '#14130f';
          var cover = document.createElement('style');
          cover.id = 'lc-swap-style';
          cover.textContent =
            'html.lc-arriving::before{content:"";position:fixed;inset:0;z-index:9999;' +
            'pointer-events:none;background:' + bg + ';opacity:1;' +
            'transition:opacity .22s ease}' +
            'html.lc-arriving.lc-arriving-out::before{opacity:0}';
          document.head.appendChild(cover);
          document.documentElement.classList.add('lc-arriving');
          // If app.js never gets far enough to call finishThemeArrival (failed
          // asset, JS error), do not leave the reader staring at a blank cover.
          window.setTimeout(function () {
            var root = document.documentElement;
            if (!root.classList.contains('lc-arriving')) return;
            root.classList.add('lc-arriving-out');
            window.setTimeout(function () {
              root.classList.remove('lc-arriving', 'lc-arriving-out');
              if (cover.parentNode) cover.parentNode.removeChild(cover);
            }, 260);
          }, 6000);
        } catch (e) {}
      }
    })();
  </script>
  <title>学习中心</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <main id="app" class="app"></main>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
