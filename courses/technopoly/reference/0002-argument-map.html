<h1>三部曲总论证地图</h1>
<p class="lede">一张图看懂波兹曼三部曲的层层递进：媒介如何一步步把文化交给技术，以及唯一的出口在哪里。</p>

<figure class="figure">

    <!-- 0. 起点 -->
    <text x="30" y="34" font-size="15">论题：媒介的每次升级，都让文化的一部分判断力流向技术</text>

    <!-- 第一层：印刷时代 -->
    <rect class="f-wash" x="30" y="56" width="620" height="84" rx="10" />
    <text class="t-accent" x="340" y="84" text-anchor="middle" font-size="14">印刷时代：秩序的建立</text>
    <text x="340" y="108" text-anchor="middle" font-size="12">信息有等级（识字门槛） · 话语靠论证 · 儿童受庇护</text>
    <text class="t-muted" x="340" y="128" text-anchor="middle" font-size="11">主导媒介：书与报纸 —— "真理长得像一行行的论证"</text>

    <path class="s-accent" d="M 340,144 L 340,180" fill="none" stroke-width="2" />
    <path class="s-accent" d="M 333,171 L 340,181 L 347,171" fill="none" stroke-width="2" />
    <text class="t-muted" x="356" y="168" font-size="11">电视拆掉门槛，画面无需训练</text>

    <!-- 第二层：电视时代 -->
    <rect class="f-bg s-ink" x="30" y="188" width="620" height="52" rx="10" stroke-width="1.5" />
    <text class="t-accent" x="340" y="210" text-anchor="middle" font-size="14">电视时代：一次升级，两道裂缝</text>
    <text class="t-muted" x="340" y="230" text-anchor="middle" font-size="11">信息获取变便宜 · 完整论证变贵 · 成人与儿童的边界消融</text>

    <!-- 两条裂缝分支 -->
    <path class="s-accent" d="M 200,244 L 200,286" fill="none" stroke-width="2" />
    <path class="s-accent" d="M 193,277 L 200,287 L 207,277" fill="none" stroke-width="2" />
    <path class="s-accent" d="M 480,244 L 480,286" fill="none" stroke-width="2" />
    <path class="s-accent" d="M 473,277 L 480,287 L 487,277" fill="none" stroke-width="2" />

    <rect class="f-bg s-muted" x="40" y="292" width="320" height="120" rx="10" stroke-width="1.5" />
    <text x="200" y="318" text-anchor="middle" font-size="13">裂缝一：《童年的消逝》（1982）</text>
    <text class="t-muted" x="200" y="342" text-anchor="middle" font-size="11">识字门槛曾是童年的庇护；电视</text>
    <text class="t-muted" x="200" y="360" text-anchor="middle" font-size="11">让成人信息对儿童免费——</text>
    <text x="200" y="382" text-anchor="middle" font-size="12">毁掉的是：一段人生（童年）</text>
    <text class="t-accent" x="200" y="402" text-anchor="middle" font-size="11">账目：接触成人信息变便宜，庇护变贵</text>

    <rect class="f-bg s-muted" x="380" y="292" width="270" height="120" rx="10" stroke-width="1.5" />
    <text x="515" y="318" text-anchor="middle" font-size="13">裂缝二：《娱乐至死》（1985）</text>
    <text class="t-muted" x="515" y="342" text-anchor="middle" font-size="11">公共话语（政治、新闻、宗教）</text>
    <text class="t-muted" x="515" y="360" text-anchor="middle" font-size="11">被改写为娱乐的形态——</text>
    <text x="515" y="382" text-anchor="middle" font-size="12">毁掉的是：一种话语（公共讨论）</text>
    <text class="t-accent" x="515" y="402" text-anchor="middle" font-size="11">账目："好看"变便宜，论证变贵</text>

    <path class="s-accent" d="M 200,416 L 200,452 L 320,452 L 320,486" fill="none" stroke-width="2" />

    <text class="t-muted" x="340" y="446" text-anchor="middle" font-size="11">两道裂缝汇流：信息泛滥 + 判断让渡</text>

    <!-- 第三层：技术垄断 -->
    <rect class="f-bg s-accent" x="30" y="492" width="620" height="118" rx="10" stroke-width="2" />

    <text x="340" y="540" text-anchor="middle" font-size="12">隐形技术当家：统计、测验、评分、流程、专家分工</text>
    <text x="340" y="560" text-anchor="middle" font-size="12">官僚主义 + 效率：无人回答"为什么"；"该不该"永远上不了议程</text>
    <text x="340" y="582" text-anchor="middle" font-size="12">计算机偶像：信息即理解 · 评分即评价</text>
    <text class="t-accent" x="340" y="602" text-anchor="middle" font-size="11">毁掉的是：一个裁判（文化的判断权）</text>

    <!-- 钥匙 -->
    <path class="s-ink" d="M 340,614 L 340,650" fill="none" stroke-width="2" />
    <rect class="f-wash s-accent" x="30" y="656" width="620" height="52" rx="10" stroke-width="2" />
    <text class="t-accent" x="340" y="678" text-anchor="middle" font-size="13">方法论钥匙（三本书共用）</text>
    <text x="340" y="698" text-anchor="middle" font-size="12">问一种新媒介：让什么变便宜？让什么变贵？——贵的那笔从不写在产品介绍里</text>

    <!-- 出口 -->
    <path class="s-ink" d="M 340,712 L 340,740" fill="none" stroke-width="2" />
    <text class="t-accent" x="340" y="756" text-anchor="middle" font-size="12">出口：有爱心的抵抗者 —— 不砸机器、不退山洞，在每次接入时选择性接受</text>
  </svg>
  <figcaption><b>读图方法：</b>自上而下是论证的推进——印刷秩序被电视升级拆出两道裂缝（左：童年的消逝；右：娱乐至死），裂缝汇流成技术垄断（文化交出裁判权）；底部两层是三本书共用的方法论钥匙与波兹曼给出的出口。每层括注"账目"，即"让什么变便宜、让什么变贵"的记法。</figcaption>
</figure>

<h2>三个使用场景</h2>
<ol>
  <li><strong>定位：</strong>遇到一个技术现象，先在图上找它属于哪一层——是工具的旧用法，还是裂缝，还是已汇流的垄断。</li>
  <li><strong>记账：</strong>对新工具补一行账（便宜/贵），写不出来的工具说明还没看它。</li>
  <li><strong>复盘：</strong>每季度沿着图走一遍自己的技术栈，检查抵抗者的清单有没有过时。</li>
</ol>
